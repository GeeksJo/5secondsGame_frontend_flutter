name: yalla
description: "يلا — 5 Seconds Party Game"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  google_fonts: ^8.0.2
  audioplayers: ^6.6.0
  shared_preferences: ^2.5.5
  google_mobile_ads: ^7.0.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/questions/
    - assets/sounds/
    - assets/images/
    - assets/images/categories/
